
modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
updateJSONURL="https://curseupdate.com/1157608/applied-experienced?ml=neoforge"
displayURL="${mod_url}"
logoFile="logo.png"
#credits=""
authors="${mod_authors}"
description='''${mod_description}'''

[[mixins]]
config = "${mod_id}.mixins.json"

[[dependencies."${mod_id}"]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId="experiencelib"
type="required"
versionRange="[${experiencelib_version},)"
ordering="AFTER"
side="BOTH"

[[dependencies."${mod_id}"]]
modId="ae2"
type="required"
versionRange="[${ae2_version},)"
ordering="AFTER"
side="BOTH"

[[dependencies."${mod_id}"]]
modId="ae2wtlib"
type="required"
versionRange="[${ae2wtlib_version},)"
ordering="BEFORE"
side="BOTH"

[[dependencies."${mod_id}"]]
modId="jei"
type="optional"
versionRange="[${jei_version},)"
ordering="AFTER"
side="CLIENT"
